
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balu Mass Smart AI - Brain</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: #ffffff;
}

.app {
    max-width: 600px;
    margin: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #0b1020;
}

.header {
    padding: 20px;
    background: #131b30;
    border-bottom: 1px solid #26334e;
}

.title {
    font-size: 22px;
    font-weight: bold;
    color: #66d9ff;
}

.subtitle {
    font-size: 13px;
    color: #a8b6d3;
    margin-top: 6px;
}

.brain-section {
    text-align: center;
    padding: 22px 15px;
}

.brain {
    width: 100px;
    height: 100px;
    margin: auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    background: radial-gradient(circle, #174b83, #10172c);
    border: 2px solid #35c7ff;
    box-shadow: 0 0 25px #148cff55;
}

.status {
    margin-top: 12px;
    color: #5bffbd;
    font-size: 13px;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.message {
    max-width: 85%;
    padding: 13px;
    margin-bottom: 12px;
    border-radius: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.bot {
    background: #18243b;
    border: 1px solid #263b5d;
    align-self: flex-start;
}

.user {
    background: #1268ce;
    margin-left: auto;
    align-self: flex-end;
}

.input-area {
    padding: 12px;
    background: #131b30;
    border-top: 1px solid #26334e;
    display: flex;
    gap: 8px;
}

.input-area input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    border-radius: 25px;
    background: #202c45;
    padding: 14px;
    color: white;
    font-size: 16px;
}

button {
    border: none;
    cursor: pointer;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 18px;
    color: white;
    background: #1677ee;
}

button:active {
    transform: scale(0.95);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.mic {
    background: #263954;
}

.footer {
    text-align: center;
    padding: 8px;
    color: #7686a6;
    font-size: 11px;
    background: #0b1020;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="title">🧠 BALU MASS SMART AI</div>
        <div class="subtitle">Your Personal AI Assistant</div>
    </div>

    <div class="brain-section">
        <div class="brain">🧠</div>
        <div class="status" id="status">● BRAIN READY</div>
    </div>

    <div class="chat" id="chat">

        <div class="message bot">
            வணக்கம் Balu! 👋

            நான் Balu Mass Smart AI.

            உங்களுக்கு Office work, Attendance, Roster,
            Reminders மற்றும் தினசரி வேலைகளில்
            உதவ தயாராக இருக்கிறேன்.

            என்ன உதவி வேண்டும்?
        </div>

    </div>

    <div class="input-area">
        <button class="mic" id="micBtn" onclick="voiceInput()">🎙️</button>

        <input
            type="text"
            id="userInput"
            placeholder="Message Balu Mass AI..."
            autocomplete="off"
        >

        <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>

    <div class="footer">
        BALU MASS SMART AI • BRAIN CORE
    </div>

</div>

<script>

// =====================================
// BALU MASS SMART AI BACKEND
// =====================================

const BACKEND_URL =
    "https://shrill-cake-faee.bbalu923.workers.dev/api/chat";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const statusText = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");

let isThinking = false;

// =====================================
// CHAT MESSAGE DISPLAY
// =====================================

function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

// =====================================
// SEND MESSAGE TO REAL AI BACKEND
// =====================================

async function sendMessage() {

    const text = input.value.trim();

    if (!text || isThinking) return;

    addMessage(text, "user");

    input.value = "";

    isThinking = true;

    sendBtn.disabled = true;

    statusText.textContent = "● AI THINKING...";

    try {

        const response = await fetch(BACKEND_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: text
            })

        });

        const resultText = await response.text();

        let result;

        try {
            result = JSON.parse(resultText);
        } catch {
            result = resultText;
        }

        if (!response.ok) {

            throw new Error(
                "Backend error: " + response.status
            );

        }

        // AI RESPONSE EXTRACTION

        let aiReply = "";

        if (typeof result === "string") {

            aiReply = result;

        } else if (result) {

            aiReply =
                result.response ??
                result.reply ??
                result.message ??
                result.text ??
                result.output ??
                result.result ??
                "";

        }

        if (!aiReply) {

            aiReply =
                "Backend response கிடைத்தது. ஆனால் AI பதிலை படிக்க முடியவில்லை.";

        }

        addMessage(aiReply, "bot");

        statusText.textContent = "● AI CONNECTED";

    } catch (error) {

        console.error("AI Connection Error:", error);

        addMessage(
            "⚠️ AI Backend-ஐ தொடர்புகொள்ள முடியவில்லை.\n\n" +
            "Internet connection மற்றும் Backend status சரிபார்க்கவும்.\n\n" +
            "Error: " + error.message,
            "bot"
        );

        statusText.textContent = "● CONNECTION ERROR";

    } finally {

        isThinking = false;

        sendBtn.disabled = false;

    }

}

// =====================================
// ENTER KEY
// =====================================

input.addEventListener("keypress", function(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

});

// =====================================
// TAMIL VOICE INPUT
// =====================================

function voiceInput() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Voice recognition இந்த browser-ல் support ஆகவில்லை. Chrome பயன்படுத்தவும்."
        );

        return;

    }

    if (isThinking) return;

    const recognition = new SpeechRecognition();

    recognition.lang = "ta-IN";

    recognition.continuous = false;

    recognition.interimResults = false;

    statusText.textContent = "● LISTENING...";

    recognition.onresult = function(event) {

        input.value = event.results[0][0].transcript;

        statusText.textContent = "● BRAIN READY";

        sendMessage();

    };

    recognition.onerror = function() {

        statusText.textContent = "● BRAIN READY";

        alert(
            "Voice input failed. மீண்டும் முயற்சி செய்யுங்கள்."
        );

    };

    recognition.onend = function() {

        if (
            statusText.textContent.includes("LISTENING")
        ) {

            statusText.textContent = "● BRAIN READY";

        }

    };

    recognition.start();

}

</script>

</body>
</html>
