<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balu Mass Smart AI - Attendance</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;margin:0;padding:14px}h1{font-size:22px;margin:4px 0 14px}.card{background:white;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 9px #00000012}label{font-weight:700;display:block;margin:8px 0}input,textarea,select,button{font:inherit;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;margin:5px 0}textarea{min-height:150px;resize:vertical}button{background:#185adb;color:white;border:0;font-weight:700;cursor:pointer}button.secondary{background:#526174}button.danger{background:#c0392b}button.small{width:auto;padding:7px 10px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #dbe2ea;padding:8px;text-align:left}th{background:#edf2f8} .row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.muted{color:#64748b;font-size:13px}.pill{display:inline-block;background:#e7eefc;padding:4px 8px;border-radius:20px;font-size:12px}.sectionTitle{margin:0 0 8px}.status{padding:8px;border-radius:8px;background:#eff6ff;margin:8px 0}.scroll{overflow:auto}.employeeForm{display:grid;grid-template-columns:1fr 1fr;gap:6px}.employeeForm button{grid-column:1/-1}@media(max-width:480px){body{padding:10px}.employeeForm{grid-template-columns:1fr}}
</style></head><body>
<h1>📋 Balu Mass Smart AI – Attendance</h1>
<div class="card"><h3 class="sectionTitle">1. Attendance Input</h3>
<label>Attendance Date</label><input type="date" id="attDate">
<label>Paste WhatsApp Shift Message</label><textarea id="waText" placeholder="Paste C1 / C2 WhatsApp roster here..."></textarea>utton
<div class="row"><button onclick="parseWhatsApp()">Parse Attendance</button><button class="secondary" onclick="clearInput()">Clear</button></div>
<div id="parseStatus" class="status muted">Paste roster and click Parse Attendance.</div><div id="preview"></div>
<button id="confirmBtn" onclick="confirmAttendance()" disabled>Confirm Attendance</button>
<button id="saveBtn" onclick="saveAttendance()" disabled>Save Attendance</button></div>
<div class="card"><h3 class="sectionTitle">2. Saved Attendance – View / Edit</h3><label>Select saved date</label><select id="savedSelect" onchange="loadSelected()"><option value="">-- Select Date --</option></select><div id="savedView"></div></div>
<div class="card"><h3 class="sectionTitle">3. Master Attendance / Employee List</h3><p class="muted">Add employee name, corridor and role here. Parsed WhatsApp names are matched against this list.</p>
<div class="employeeForm"><input id="empName" placeholder="Employee name"><select id="empCorr"><option>C1</option><option>C2</option></select><select id="empRole"><option>Supervisor</option><option>Technician</option><option>Other</option></select><button onclick="addEmployee()">Add Employee</button></div><div id="masterList"></div></div>
<script>
const KEY='balu_attendance_records_v5',MASTER='balu_attendance_master_v5';
let records=JSON.parse(localStorage.getItem(KEY)||'{}'), master=JSON.parse(localStorage.getItem(MASTER)||'[]');
let parsed=[],confirmed=false,editingDate=null;
const shiftNames={'FIRST SHIFT':'First Shift','FIRST':'First Shift','1ST SHIFT':'First Shift','SECOND SHIFT':'Second Shift','SECOND':'Second Shift','2ND SHIFT':'Second Shift','GENERAL SHIFT':'General Shift','GENERAL':'General Shift','NIGHT SHIFT':'Night Shift','NIGHT':'Night Shift','MAINLINE NIGHT':'Mainline Night','MAINLINE NIGHT SHIFT':'Mainline Night','ARRIVAL':'Arrival','ARR':'Arrival','WEEK OFF':'Week Off','W/O':'Week Off','COMP OFF':'Comp Off','C/O':'Comp Off','LEAVE':'Leave'};
function norm(s){return s.toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function canonical(name){let n=norm(name);const aliases={'THIRUVENGIDASAMY':'THIRU','KISHORE KUMAR JHA':'KISHORE','KISHORE JHA':'KISHORE','AJITH A':'A AJITH','KARTHICK SAM':'KARTHIC SAM','VASANTHARAJ':'VASANTHA RAJ','VETRIVEL':'VETRI','DEENA':'DHEENA','DHEENAA':'DHEENA','SUBASH':'SUBHASH','IYAPPAN':'IYYAPPAN','RANJIHKUMAR':'RANJIKUMAR','MADHAN KUMAR':'MADHANKUMAR','ARUNKUMAR':'ARUN'};return aliases[n]||n}
function parseWhatsApp(){const text=document.getElementById('waText').value.trim();if(!text){alert('WhatsApp message paste pannunga.');return}parsed=[];let corridor='C1',shift='';const lines=text.split(/\n/);for(let raw of lines){let line=raw.trim().replace(/^[-*•\s]+/,'');if(!line)continue;let up=norm(line);if(/\bC1\b|CORRIDOR 1/.test(up)){corridor='C1';shift='';if(/\bC1\b.*(FIRST|SECOND|GENERAL|NIGHT|ARRIVAL|WEEK OFF|COMP OFF|LEAVE)/.test(up)){}continue}if(/\bC2\b|CORRIDOR 2/.test(up)){corridor='C2';shift='';continue}
let found=null;for(const key of Object.keys(shiftNames)){if(up===key||up.startsWith(key+' ')||up.includes(key+':')){found=shiftNames[key];break}}
if(found){shift=found;let rest=line.replace(new RegExp(keySafe(shift),'i'),'').replace(/^[:\-\s]+/,'');if(rest)extractNames(rest,corridor,shift);continue}
if(shift){extractNames(line,corridor,shift)} }
// Remove duplicates by name+corridor and match master where possible
let out=[];for(let item of parsed){let existing=out.find(x=>canonical(x.name)===canonical(item.name)&&x.corridor===item.corridor);if(existing)existing.shift=item.shift;else out.push(item)}parsed=out;
if(!parsed.length){document.getElementById('parseStatus').textContent='Names detect aagala. WhatsApp format check pannunga.';document.getElementById('preview').innerHTML='';return}
confirmed=false;document.getElementById('confirmBtn').disabled=false;document.getElementById('saveBtn').disabled=true;renderPreview();document.getElementById('parseStatus').textContent=`${parsed.length} entries parsed. Confirm once, then save.`}
function keySafe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function extractNames(line,corridor,shift){line=line.replace(/\([^)]*\)/g,'').replace(/\b\d+\b/g,'').trim();let parts=line.split(/[,;|]+/).map(x=>x.replace(/^[-*•\s]+/,'').trim()).filter(Boolean);for(let p of parts){p=p.replace(/\s+(AND|&)+\s+/gi,',').trim();if(!p)continue;let names=p.split(',').map(x=>x.trim()).filter(Boolean);for(let name of names){name=name.replace(/\b(ARR|C\/O|W\/O)\b/gi,'').trim();if(name.length<2||/^(C1|C2|CORRIDOR|SHIFT|SUPERVISOR|TECHNICIAN)$/i.test(name))continue;parsed.push({name,corridor,shift,role:findMaster(name)?.role||'Unassigned'})}}}
function findMaster(name){return master.find(e=>canonical(e.name)===canonical(name))}
function renderPreview(){let html='<div class="scroll"><table><thead><tr><th>#</th><th>Name</th><th>Corridor</th><th>Shift</th><th>Role</th></tr></thead><tbody>';parsed.forEach((e,i)=>{let m=findMaster(e.name);html+=`<tr><td>${i+1}</td><td>${esc(e.name)}${m?'':' <span class="pill">Not in Master</span>'}</td><td>${esc(e.corridor)}</td><td>${esc(e.shift)}</td><td>${esc(m?.role||e.role||'Unassigned')}</td></tr>`});html+='</tbody></table></div>';document.getElementById('preview').innerHTML=html}
function confirmAttendance(){if(!parsed.length)return;confirmed=true;document.getElementById('confirmBtn').disabled=true;document.getElementById('saveBtn').disabled=false;document.getElementById('parseStatus').textContent='Attendance confirmed. Save Attendance click pannunga.'}
function saveAttendance(){if(!confirmed){alert('First Confirm Attendance click pannunga.');return}let date=document.getElementById('attDate').value;if(!date){alert('Attendance date select pannunga.');return}records[date]={date,entries:parsed.map(e=>({...e,role:findMaster(e.name)?.role||e.role||'Unassigned'})),updatedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(records));editingDate=null;confirmed=false;refreshSaved();document.getElementById('parseStatus').textContent=`${date} attendance saved successfully.`;document.getElementById('saveBtn').disabled=true;document.getElementById('confirmBtn').disabled=true;renderSaved(date)}
function refreshSaved(){let sel=document.getElementById('savedSelect'),cur=sel.value;sel.innerHTML='<option value="">-- Select Date --</option>';Object.keys(records).sort().reverse().forEach(d=>sel.innerHTML+=`<option value="${d}">${d}</option>`);if(records[cur])sel.value=cur}
function loadSelected(){let d=document.getElementById('savedSelect').value;if(d)renderSaved(d);else document.getElementById('savedView').innerHTML=''}
function renderSaved(date){let r=records[date];if(!r)return;document.getElementById('savedSelect').value=date;let html=`<p><b>${date}</b> <span class="pill">${r.entries.length} employees</span></p><div class="scroll"><table><thead><tr><th>Name</th><th>Corridor</th><th>Shift</th><th>Role</th></tr></thead><tbody>`;r.entries.forEach((e,i)=>html+=`<tr><td><input value="${attr(e.name)}" id="editname${i}"></td><td><select id="editcorr${i}"><option ${e.corridor==='C1'?'selected':''}>C1</option><option ${e.corridor==='C2'?'selected':''}>C2</option></select></td><td><select id="editshift${i}">${['First Shift','Second Shift','General Shift','Night Shift','Mainline Night','Arrival','Week Off','Comp Off','Leave'].map(s=>`<option ${e.shift===s?'selected':''}>${s}</option>`).join('')}</select></td><td><input value="${attr(e.role||'Unassigned')}" id="editrole${i}"></td></tr>`);html+='</tbody></table></div><div class="row"><button onclick="updateSaved(\''+date+'\')">Save Edited Attendance</button><button class="secondary" onclick="exportSaved(\''+date+'\')">Export CSV</button><button class="danger" onclick="deleteSaved(\''+date+'\')">Delete</button></div>';document.getElementById('savedView').innerHTML=html}
function updateSaved(date){let r=records[date];r.entries=r.entries.map((e,i)=>({name:document.getElementById('editname'+i).value.trim(),corridor:document.getElementById('editcorr'+i).value,shift:document.getElementById('editshift'+i).value,role:document.getElementById('editrole'+i).value.trim()})).filter(e=>e.name);r.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(records));renderSaved(date);alert('Attendance updated!')}
function deleteSaved(date){if(!confirm(date+' attendance delete pannava?'))return;delete records[date];localStorage.setItem(KEY,JSON.stringify(records));refreshSaved();document.getElementById('savedView').innerHTML=''}
function exportSaved(date){let r=records[date];let rows=[['Name','Corridor','Shift','Role'],...r.entries.map(e=>[e.name,e.corridor,e.shift,e.role||''])];let csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');let blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Attendance_'+date+'.csv';a.click();URL.revokeObjectURL(url)}
function addEmployee(){let name=document.getElementById('empName').value.trim(),corridor=document.getElementById('empCorr').value,role=document.getElementById('empRole').value;if(!name){alert('Employee name enter pannunga');return}if(findMaster(name)){alert('Employee already exists');return}master.push({name,corridor,role});localStorage.setItem(MASTER,JSON.stringify(master));document.getElementById('empName').value='';renderMaster()}
function renderMaster(){let el=document.getElementById('masterList');if(!master.length){el.innerHTML='<p class="muted">Master list empty. Add employees above.</p>';return}el.innerHTML='<div class="scroll"><table><thead><tr><th>Name</th><th>Corridor</th><th>Role</th><th></th></tr></thead><tbody>'+master.map((e,i)=>`<tr><td>${esc(e.name)}</td><td>${esc(e.corridor)}</td><td>${esc(e.role)}</td><td><button class="small danger" onclick="removeMaster(${i})">Remove</button></td></tr>`).join('')+'</tbody></table></div>'}
function removeMaster(i){if(!confirm('Remove this employee from Master?'))return;master.splice(i,1);localStorage.setItem(MASTER,JSON.stringify(master));renderMaster()}
function clearInput(){document.getElementById('waText').value='';parsed=[];confirmed=false;document.getElementById('preview').innerHTML='';document.getElementById('confirmBtn').disabled=true;document.getElementById('saveBtn').disabled=true;document.getElementById('parseStatus').textContent='Input cleared.'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(s){return esc(s)}
function init(){document.getElementById('attDate').value=new Date().toISOString().slice(0,10);refreshSaved();renderMaster()}
init();
</script></body></html>
