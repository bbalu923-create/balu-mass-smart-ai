
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balu Smart AI - Attendance</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f5fb;
  margin: 0;
  padding: 15px;
  color: #172033;
}
.container {
  max-width: 1000px;
  margin: auto;
}
.card {
  background: white;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 15px;
  box-shadow: 0 2px 10px #0001;
}
h2, h3 { margin-top: 5px; }
textarea, input, select {
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  margin: 7px 0;
  border: 1px solid #ccd3df;
  border-radius: 8px;
  font-size: 15px;
}
textarea { min-height: 200px; }
button {
  padding: 11px 14px;
  border: 0;
  border-radius: 8px;
  margin: 5px 3px;
  cursor: pointer;
  font-weight: bold;
  background: #1459d9;
  color: white;
}
button.secondary { background: #475569; }
button.danger { background: #dc2626; }
button.success { background: #15803d; }
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}
th, td {
  border: 1px solid #ddd;
  padding: 7px;
  text-align: left;
}
th { background: #e8efff; }
td input, td select { min-width: 100px; }
.table-wrap { overflow-x: auto; }
.small { color: #667085; font-size: 13px; }
#preview { display: none; }
</style>
</head>
<body>
<div class="container">

<div class="card">
<h2>📋 Balu Smart AI – Attendance</h2>
<p class="small">WhatsApp Shift Plan → Preview → Edit → Save</p>

<label>Date</label>
<input type="date" id="attendanceDate">

<label>Paste WhatsApp Shift Plan</label>
<textarea id="whatsappText" placeholder="Paste complete C1 and C2 shift plan here..."></textarea>

<button onclick="parsePlan()">Parse Attendance</button>
<button class="secondary" onclick="clearInput()">Clear</button>
</div>

<div class="card" id="preview">
<h3>Attendance Preview</h3>
<div id="count"></div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Corridor</th>
<th>Employee</th>
<th>Shift / Status</th>
<th>Code</th>
<th>Designation</th>
<th>Replacement</th>
<th>Action</th>
</tr>
</thead>
<tbody id="attendanceRows"></tbody>
</table>
</div>

<button class="success" onclick="saveAttendance()">Save Attendance</button>
<button onclick="exportCSV()">Export Excel CSV</button>
<button class="secondary" onclick="addEmployee()">+ Add Employee</button>
</div>

<div class="card">
<h3>Saved Attendance</h3>
<input type="date" id="loadDate">
<button onclick="loadAttendance()">Load Saved Data</button>
<button class="danger" onclick="deleteSaved()">Delete Saved Date</button>
<div id="savedInfo"></div>
</div>

</div>

<script>
const STORAGE_KEY = "balu_attendance_parser_v3";

const SHIFT_CODES = {
  "First Shift": "A",
  "Second Shift": "B",
  "General Shift": "G",
  "Night Shift": "C",
  "Mainline Night": "C",
  "Arrival": "ARR",
  "Week Off": "R",
  "Comp Off": "C/O",
  "Leave": "L"
};

let attendanceData = [];

// Date default
document.getElementById("attendanceDate").value =
  new Date().toISOString().slice(0,10);
document.getElementById("loadDate").value =
  document.getElementById("attendanceDate").value;

function cleanLine(s) {
  return s.replace(/\*/g, "").trim();
}

function identifyHeading(line) {
  const t = line.toLowerCase();

  if (/night shift.*mainline|mainline.*night shift|night shift reporting.*mainline/.test(t))
    return "Mainline Night";

  if (/first shift/.test(t))
    return "First Shift";

  if (/second shift/.test(t))
    return "Second Shift";

  if (/general shift.*stores|stores.*general shift/.test(t))
    return "General Shift";

  if (/general shift/.test(t))
    return "General Shift";

  if (/night shift/.test(t))
    return "Night Shift";

  if (/arrival|\barr\b/.test(t))
    return "Arrival";

  if (/week off/.test(t))
    return "Week Off";

  if (/comp.?off/.test(t))
    return "Comp Off";

  if (/\bleave\b/.test(t))
    return "Leave";

  return "";
}

function identifyCorridor(line) {
  const t = line.toUpperCase();

  if (/\bC\s*[-]?\s*1\b/.test(t) ||
      /\bCORRIDOR\s*[-]?\s*1\b/.test(t))
    return "C1";

  if (/\bC\s*[-]?\s*2\b/.test(t) ||
      /\bCORRIDOR\s*[-]?\s*2\b/.test(t))
    return "C2";

  return "";
}

function extractEmployee(line) {
  line = line.replace(/^\d+[\.\)]\s*/, "").trim();
  line = line.replace(/^[-•]\s*/, "").trim();

  if (!line || line.length > 100) return null;

  // Skip headings and explanatory text
  if (/^(work activity|first shift|second shift|general shift|night shift|week off|comp off|leave|arrival|corridor|date|dear|sir)/i.test(line))
    return null;

  let replacement = "";
  const replacementMatch = line.match(/\(In Place Of\s+([^)]+)\)/i);

  if (replacementMatch) {
    replacement = replacementMatch[1].trim();
    line = line.replace(replacementMatch[0], "").trim();
  }

  // Remove designation tags from employee name
  let designation = "";
  if (/\(EPIC\)/i.test(line)) designation = "EPIC";

  line = line.replace(/\(EPIC\)/ig, "");
  line = line.replace(/\([^)]*Reliever[^)]*\)/ig, "");
  line = line.replace(/\([^)]*SMR[^)]*\)/ig, "");
  line = line.replace(/\([^)]*In Place Of[^)]*\)/ig, "");
  line = line.replace(/[()]/g, "");
  line = line.trim();

  // Remove leading/trailing separators
  line = line.replace(/^[-:]+|[-:]+$/g, "").trim();

  if (!line || line.length < 2) return null;

  return {
    employee: line,
    designation,
    replacement
  };
}

function parsePlan() {
  const text = document.getElementById("whatsappText").value;
  if (!text.trim()) {
    alert("WhatsApp shift plan paste pannunga.");
    return;
  }

  let corridor = "";
  let shift = "";
  let parsed = [];

  const lines = text.split(/\r?\n/);

  for (const raw of lines) {
    const line = cleanLine(raw);
    if (!line) continue;

    // Corridor heading
    const detectedCorridor = identifyCorridor(line);
    if (detectedCorridor) {
      corridor = detectedCorridor;
      shift = "";
      continue;
    }

    // Shift heading
    const detectedShift = identifyHeading(line);
    if (detectedShift) {
      shift = detectedShift;
      continue;
    }

    if (!corridor || !shift) continue;

    // Skip heading/time/report lines
    if (/from\s+\d{1,2}[:.]\d{2}|to\s+\d{1,2}[:.]\d{2}|hrs|sap|dwn|depot|mainline|stores|planned|work activity/i.test(line)) {
      // But SAP/DWN lines can contain actual names; only skip obvious time/header lines
      if (/shift|reporting|work activity|from\s+\d{1,2}[:.]\d{2}|to\s+\d{1,2}[:.]\d{2}/i.test(line)) continue;
    }

    const person = extractEmployee(line);
    if (!person) continue;

    parsed.push({
      corridor,
      employee: person.employee,
      shift,
      code: SHIFT_CODES[shift] || "",
      designation: person.designation,
      replacement: person.replacement
    });
  }

  attendanceData = mergeRows(parsed);
  renderPreview();
}

function mergeRows(rows) {
  const map = new Map();

  for (const row of rows) {
    const key = row.corridor + "|" + row.employee.toLowerCase();
    if (!map.has(key)) {
      map.set(key, {
        corridor: row.corridor,
        employee: row.employee,
        shifts: [],
        designation: row.designation || "",
        replacement: row.replacement || ""
      });
    }

    const item = map.get(key);

    if (!item.shifts.includes(row.shift)) {
      item.shifts.push(row.shift);
    }

    if (row.designation) item.designation = row.designation;
    if (row.replacement) item.replacement = row.replacement;
  }

  return Array.from(map.values()).map(item => {
    const code = mergeCodes(item.shifts.map(s => SHIFT_CODES[s]));
    return {
      corridor: item.corridor,
      employee: item.employee,
      shift: item.shifts.join(" + "),
      code,
      designation: item.designation,
      replacement: item.replacement
    };
  });
}

function mergeCodes(codes) {
  const unique = [...new Set(codes.filter(Boolean))];

  if (unique.includes("R")) return "R";
  if (unique.length === 1) return unique[0];

  if (unique.includes("C/O") && unique.length === 1) return "C/O";
  if (unique.includes("L") && unique.length === 1) return "L";

  const order = ["A", "B", "G", "C"];
  const shifts = order.filter(c => unique.includes(c));

  if (unique.includes("C/O")) {
    if (shifts.length === 0) return "C/O";
    return "C/O&" + shifts.join("&");
  }

  if (unique.includes("L")) {
    if (shifts.length === 0) return "L";
    return shifts.join("&") + "/L";
  }

  return shifts.join("&") || unique.join("&");
}

function renderPreview() {
  const tbody = document.getElementById("attendanceRows");
  tbody.innerHTML = "";

  attendanceData.forEach((row, index) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <select onchange="updateRow(${index},'corridor',this.value)">
          <option ${row.corridor==="C1"?"selected":""}>C1</option>
          <option ${row.corridor==="C2"?"selected":""}>C2</option>
        </select>
      </td>
      <td><input value="${escapeHTML(row.employee)}"
        onchange="updateRow(${index},'employee',this.value)"></td>
      <td><input value="${escapeHTML(row.shift)}"
        onchange="updateRow(${index},'shift',this.value)"></td>
      <td><input value="${escapeHTML(row.code)}"
        onchange="updateRow(${index},'code',this.value)"></td>
      <td><input value="${escapeHTML(row.designation||"")}"
        onchange="updateRow(${index},'designation',this.value)"></td>
      <td><input value="${escapeHTML(row.replacement||"")}"
        onchange="updateRow(${index},'replacement',this.value)"></td>
      <td><button class="danger" onclick="removeRow(${index})">Delete</button></td>
    `;

    tbody.appendChild(tr);
  });

  document.getElementById("count").innerHTML =
    "<b>Total Employees: " + attendanceData.length + "</b>";

  document.getElementById("preview").style.display = "block";
}

function escapeHTML(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function updateRow(index, field, value) {
  attendanceData[index][field] = value;
}

function removeRow(index) {
  attendanceData.splice(index, 1);
  renderPreview();
}

function addEmployee() {
  attendanceData.push({
    corridor: "C1",
    employee: "",
    shift: "",
    code: "",
    designation: "",
    replacement: ""
  });
  renderPreview();
}

function saveAttendance() {
  const date = document.getElementById("attendanceDate").value;
  if (!date) {
    alert("Date select pannunga.");
    return;
  }

  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  saved[date] = attendanceData;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));

  document.getElementById("loadDate").value = date;
  document.getElementById("savedInfo").innerHTML =
    "Saved: " + date + " | " + attendanceData.length + " employees";

  alert("Attendance saved successfully!");
}

function loadAttendance() {
  const date = document.getElementById("loadDate").value;
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  if (!saved[date]) {
    alert("இந்த date-க்கு saved attendance இல்லை.");
    return;
  }

  attendanceData = saved[date];
  document.getElementById("attendanceDate").value = date;
  renderPreview();

  document.getElementById("savedInfo").innerHTML =
    "Loaded: " + date + " | " + attendanceData.length + " employees";
}

function deleteSaved() {
  const date = document.getElementById("loadDate").value;
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  if (!saved[date]) {
    alert("Saved attendance கிடைக்கவில்லை.");
    return;
  }

  if (!confirm(date + " attendance delete pannava?")) return;

  delete saved[date];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  document.getElementById("savedInfo").innerHTML = "Deleted: " + date;
}

function clearInput() {
  document.getElementById("whatsappText").value = "";
}

function exportCSV() {
  if (!attendanceData.length) {
    alert("Attendance data empty.");
    return;
  }

  const date = document.getElementById("attendanceDate").value;

  const rows = [
    ["Date", "Corridor", "Employee", "Shift", "Code", "Designation", "Replacement"],
    ...attendanceData.map(r => [
      date, r.corridor, r.employee, r.shift, r.code,
      r.designation, r.replacement
    ])
  ];

  const csv = rows.map(row =>
    row.map(value => '"' + String(value || "").replace(/"/g,'""') + '"').join(",")
  ).join("\n");

  const blob = new Blob(["\uFEFF" + csv], {
    type: "text/csv;charset=utf-8;"
  });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "Attendance_" + date + ".csv";
  link.click();
  URL.revokeObjectURL(link.href);
}
</script>

</body>
</html>
