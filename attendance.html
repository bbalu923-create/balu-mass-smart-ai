<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balu Smart AI - Attendance</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f5fb;
  margin: 0;
  padding: 15px;
  color: #172033;
}
.container {
  max-width: 1000px;
  margin: auto;
}
.card {
  background: white;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 15px;
  box-shadow: 0 2px 10px #0001;
}
h2, h3 { margin-top: 5px; }
textarea, input, select {
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  margin: 7px 0;
  border: 1px solid #ccd3df;
  border-radius: 8px;
  font-size: 15px;
}
textarea { min-height: 200px; }
button {
  padding: 11px 14px;
  border: 0;
  border-radius: 8px;
  margin: 5px 3px;
  cursor: pointer;
  font-weight: bold;
  background: #1459d9;
  color: white;
}
button.secondary { background: #475569; }
button.danger { background: #dc2626; }
button.success { background: #15803d; }

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}
th, td {
  border: 1px solid #ddd;
  padding: 7px;
  text-align: left;
}
th { background: #e8efff; }
td input, td select { min-width: 100px; }
.table-wrap { overflow-x: auto; }
.small { color: #667085; font-size: 13px; }
#preview { display: none; }
.code-check {
  background: #fff1c2;
  color: #7a4b00;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h2>📋 Balu Smart AI – Attendance</h2>
<p class="small">WhatsApp Shift Plan → Preview → Edit → Save</p>

<label>Date</label>
<input type="date" id="attendanceDate">

<label>Paste WhatsApp Shift Plan</label>
<textarea id="whatsappText"
placeholder="Paste complete C1 and C2 shift plan here..."></textarea>

<button onclick="parsePlan()">Parse Attendance</button>
<button class="secondary" onclick="clearInput()">Clear</button>
</div>

<div class="card" id="preview">
<h3>Attendance Preview</h3>
<div id="count"></div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Corridor</th>
<th>Employee Name</th>
<th>Shift</th>
<th>Code</th>
<th>Action</th>
</tr>
</thead>
<tbody id="attendanceRows"></tbody>
</table>
</div>

<button class="success" onclick="saveAttendance()">Save Attendance</button>
<button onclick="exportCSV()">Export Excel CSV</button>
<button class="secondary" onclick="addEmployee()">+ Add Employee</button>
</div>

<div class="card">
<h3>Saved Attendance</h3>
<input type="date" id="loadDate">
<button onclick="loadAttendance()">Load Saved Data</button>
<button class="danger" onclick="deleteSaved()">Delete Saved Date</button>
<div id="savedInfo"></div>
</div>

</div>

<script>
const STORAGE_KEY = "balu_attendance_parser_v3";

const SHIFT_CODES = {
  "First Shift": "A",
  "Second Shift": "B",
  "General Shift": "G",
  "Night Shift": "C",
  "Mainline Night": "C",
  "Arrival": "ARR",
  "Week Off": "R",
  "Comp Off": "C/O",
  "Leave": "L"
};

let attendanceData = [];

/* Local date (avoids UTC date issue) */
function getLocalDate() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

document.getElementById("attendanceDate").value = getLocalDate();
document.getElementById("loadDate").value = getLocalDate();

/* Remove WhatsApp formatting */
function cleanLine(s) {
  return s
    .replace(/\*/g, "")
    .replace(/_/g, "")
    .trim();
}

/* Detect corridor */
function identifyCorridor(line) {
  const t = line.toUpperCase().trim();

  if (/^(C\s*[-]?\s*1|CORRIDOR\s*[-]?\s*1)\b/.test(t) ||
      /\bCORRIDOR\s*[-]?\s*1\b/.test(t)) {
    return "C1";
  }

  if (/^(C\s*[-]?\s*2|CORRIDOR\s*[-]?\s*2)\b/.test(t) ||
      /\bCORRIDOR\s*[-]?\s*2\b/.test(t)) {
    return "C2";
  }

  return "";
}

/* Detect shift headings */
function identifyHeading(line) {
  const t = line.toLowerCase().replace(/[*:_-]/g, " ").trim();

  if (/night shift.*mainline|mainline.*night shift|night shift reporting.*mainline/.test(t))
    return "Mainline Night";

  if (/first shift/.test(t))
    return "First Shift";

  if (/second shift/.test(t))
    return "Second Shift";

  if (/general shift/.test(t))
    return "General Shift";

  if (/night shift/.test(t))
    return "Night Shift";

  if (/week off/.test(t))
    return "Week Off";

  if (/comp\s*off|compensatory off/.test(t))
    return "Comp Off";

  if (/^\s*(arrival|arr)\b/.test(t) || /\b(arrival list|arrival staff)\b/.test(t))
    return "Arrival";

  if (/^\s*leave\b/.test(t))
    return "Leave";

  return "";
}

/* Ignore non-employee lines */
function isSkipLine(line) {
  if (!line) return true;

  if (/^(work activity|planned|date|dear|sir|madam|corridor|shift plan)\b/i.test(line))
    return true;

  if (/^(first shift|second shift|general shift|night shift|week off|comp off|leave|arrival|arr)\b/i.test(line))
    return true;

  if (/from\s+\d{1,2}[:.]\d{2}/i.test(line))
    return true;

  if (/to\s+\d{1,2}[:.]\d{2}/i.test(line))
    return true;

  if (/\bhrs?\b/i.test(line) && /\d/.test(line))
    return true;

  return false;
}

/* Remove extra information; keep employee name only */
function extractEmployee(line) {
  line = line.replace(/^\d+[\.\)]\s*/, "");
  line = line.replace(/^[-•]\s*/, "");
  line = line.trim();

  if (isSkipLine(line)) return null;
  if (line.length > 100) return null;

  /* Remove bracketed information:
     EPIC, SMR, In Place Of, Reliever, designation etc. */
  line = line.replace(/\([^)]*\)/g, "");
  line = line.replace(/\[[^\]]*\]/g, "");

  /* Remove remaining unwanted labels */
  line = line.replace(/\bEPIC\b/ig, "");
  line = line.replace(/\bSMR\b/ig, "");
  line = line.replace(/\bReliever\b/ig, "");
  line = line.replace(/\bIn Place Of\b/ig, "");

  line = line.replace(/^[\s\-:]+|[\s\-:]+$/g, "");
  line = line.replace(/\s+/g, " ").trim();

  if (!line || line.length < 2) return null;

  return line;
}

/* Split comma-separated names while respecting brackets */
function splitEmployeeNames(line) {
  return line.split(",").map(x => x.trim()).filter(Boolean);
}

/* Parse WhatsApp plan */
function parsePlan() {
  const text = document.getElementById("whatsappText").value;

  if (!text.trim()) {
    alert("WhatsApp shift plan paste pannunga.");
    return;
  }

  let corridor = "";
  let shift = "";
  const parsed = [];

  const lines = text.split(/\r?\n/);

  for (const raw of lines) {
    const line = cleanLine(raw);
    if (!line) continue;

    const detectedCorridor = identifyCorridor(line);

    if (detectedCorridor) {
      corridor = detectedCorridor;
      shift = "";
      continue;
    }

    const detectedShift = identifyHeading(line);

    if (detectedShift) {
      shift = detectedShift;
      continue;
    }

    if (!corridor || !shift) continue;
    if (isSkipLine(line)) continue;

    const names = splitEmployeeNames(line);

    for (const rawName of names) {
      const employee = extractEmployee(rawName);
      if (!employee) continue;

      parsed.push({
        corridor,
        employee,
        shift,
        code: SHIFT_CODES[shift] || ""
      });
    }
  }

  attendanceData = mergeRows(parsed);

  if (!attendanceData.length) {
    alert("Employee names detect aagala. WhatsApp plan headings check pannunga.");
    return;
  }

  renderPreview();
}

/* Merge duplicate names within the same corridor */
function mergeRows(rows) {
  const map = new Map();

  for (const row of rows) {
    const employee = row.employee.trim();
    if (!employee) continue;

    const key = row.corridor + "|" + employee.toLowerCase();

    if (!map.has(key)) {
      map.set(key, {
        corridor: row.corridor,
        employee,
        shifts: [],
        codes: []
      });
    }

    const item = map.get(key);

    if (!item.shifts.includes(row.shift)) {
      item.shifts.push(row.shift);
    }

    if (row.code && !item.codes.includes(row.code)) {
      item.codes.push(row.code);
    }
  }

  return Array.from(map.values()).map(item => {
    return {
      corridor: item.corridor,
      employee: item.employee,
      shift: item.shifts.join(" + "),
      code: mergeCodes(item.codes),
    };
  });
}

/* Only approved combinations */
function mergeCodes(codes) {
  const unique = [...new Set(codes.filter(Boolean))];

  if (unique.length === 0) return "";
  if (unique.length === 1) return unique[0];

  const sorted = unique.slice().sort();

  const key = sorted.join("|");

  const approved = {
    "A|C": "A&C",
    "C/O|C": "C/O&C",
    "A|C/O": "A&C/O",
    "A|L": "A/L",
    "C|L": "L/C",
    "C/O|L": "L&C/O"
  };

  if (approved[key]) return approved[key];

  /* Unapproved combinations will not be silently guessed */
  return "CHECK";
}

/* Preview */
function renderPreview() {
  const tbody = document.getElementById("attendanceRows");
  tbody.innerHTML = "";

  attendanceData.forEach((row, index) => {
    const tr = document.createElement("tr");

    const codeClass = row.code === "CHECK" ? "code-check" : "";

    tr.innerHTML = `
      <td>
        <select onchange="updateRow(${index},'corridor',this.value)">
          <option value="C1" ${row.corridor === "C1" ? "selected" : ""}>C1</option>
          <option value="C2" ${row.corridor === "C2" ? "selected" : ""}>C2</option>
        </select>
      </td>

      <td>
        <input value="${escapeHTML(row.employee)}"
          onchange="updateRow(${index},'employee',this.value)">
      </td>

      <td>
        <input value="${escapeHTML(row.shift)}"
          onchange="updateRow(${index},'shift',this.value)">
      </td>

      <td>
        <input class="${codeClass}" value="${escapeHTML(row.code)}"
          onchange="updateRow(${index},'code',this.value)">
      </td>

      <td>
        <button class="danger" onclick="removeRow(${index})">Delete</button>
      </td>
    `;

    tbody.appendChild(tr);
  });

  const c1Count = attendanceData.filter(x => x.corridor === "C1").length;
  const c2Count = attendanceData.filter(x => x.corridor === "C2").length;
  const checkCount = attendanceData.filter(x => x.code === "CHECK").length;

  document.getElementById("count").innerHTML =
    `<b>Total Employees: ${attendanceData.length}</b>
     <br>C1: ${c1Count} | C2: ${c2Count}
     ${checkCount ? `<br><span style="color:#b45309"><b>CHECK required: ${checkCount}</b></span>` : ""}`;

  document.getElementById("preview").style.display = "block";
}

/* HTML safety */
function escapeHTML(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* Edit */
function updateRow(index, field, value) {
  attendanceData[index][field] = value.trim();
}

/* Delete employee */
function removeRow(index) {
  attendanceData.splice(index, 1);
  renderPreview();
}

/* Add employee manually */
function addEmployee() {
  attendanceData.push({
    corridor: "C1",
    employee: "",
    shift: "",
    code: ""
  });

  renderPreview();
}

/* Save attendance */
function saveAttendance() {
  const date = document.getElementById("attendanceDate").value;

  if (!date) {
    alert("Date select pannunga.");
    return;
  }

  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  /* Save only required fields */
  saved[date] = attendanceData.map(row => ({
    corridor: row.corridor,
    employee: row.employee,
    shift: row.shift,
    code: row.code
  }));

  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));

  document.getElementById("loadDate").value = date;

  document.getElementById("savedInfo").textContent =
    "Saved: " + date + " | " + attendanceData.length + " employees";

  alert("Attendance saved successfully!");
}

/* Load saved attendance */
function loadAttendance() {
  const date = document.getElementById("loadDate").value;
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  if (!saved[date]) {
    alert("இந்த date-க்கு saved attendance இல்லை.");
    return;
  }

  /* Old saved data cleanup */
  attendanceData = saved[date].map(row => ({
    corridor: row.corridor || "C1",
    employee: row.employee || "",
    shift: row.shift || "",
    code: row.code || ""
  }));

  document.getElementById("attendanceDate").value = date;

  renderPreview();

  document.getElementById("savedInfo").textContent =
    "Loaded: " + date + " | " + attendanceData.length + " employees";
}

/* Delete saved attendance date */
function deleteSaved() {
  const date = document.getElementById("loadDate").value;
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  if (!saved[date]) {
    alert("Saved attendance கிடைக்கவில்லை.");
    return;
  }

  if (!confirm(date + " attendance delete pannava?")) return;

  delete saved[date];

  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));

  document.getElementById("savedInfo").textContent = "Deleted: " + date;
}

/* Clear pasted plan */
function clearInput() {
  document.getElementById("whatsappText").value = "";
}

/* Export CSV */
function exportCSV() {
  if (!attendanceData.length) {
    alert("Attendance data empty.");
    return;
  }

  const date = document.getElementById("attendanceDate").value;

  const rows = [
    ["Date", "Corridor", "Employee Name", "Shift", "Code"],
    ...attendanceData.map(r => [
      date,
      r.corridor,
      r.employee,
      r.shift,
      r.code
    ])
  ];

  const csv = rows.map(row =>
    row.map(value =>
      '"' + String(value || "").replace(/"/g, '""') + '"'
    ).join(",")
  ).join("\n");

  const blob = new Blob(["\uFEFF" + csv], {
    type: "text/csv;charset=utf-8;"
  });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "Attendance_" + date + ".csv";
  link.click();

  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}
</script>
</body>
</html>
