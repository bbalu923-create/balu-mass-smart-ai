
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balu Daily Assistant</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#101827;
color:white;
padding:16px;
}
header{
background:#1e293b;
padding:20px;
border-radius:16px;
text-align:center;
}
h1{font-size:25px}
.card{
background:#1e293b;
padding:18px;
border-radius:16px;
margin-top:16px;
}
input{
width:100%;
padding:14px;
margin-top:10px;
border-radius:10px;
border:1px solid #475569;
background:#101827;
color:white;
font-size:16px;
}
button{
padding:13px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
margin-top:10px;
cursor:pointer;
}
.addBtn{width:100%}
.task{
background:#29364b;
padding:14px;
margin-top:12px;
border-radius:12px;
}
.task small{color:#aab8cc}
.task button{width:auto;margin-right:5px}
.done{
text-decoration:line-through;
opacity:.6;
}
.delete{background:#dc2626}
.complete{background:#16a34a}
.back{
background:#475569;
width:100%;
}
</style>
</head>

<body>

<header>
<h1>🤖 Balu Mass Smart AI</h1>
<p>📅 Daily Assistant</p>
</header>

<div class="card">
<h2>➕ Add New Task</h2>

<input id="taskInput" placeholder="Enter your task">

<input id="taskDate" type="date">

<button class="addBtn" onclick="addTask()">➕ Add Task</button>
</div>

<div class="card">
<h2>📋 My Tasks</h2>
<p id="count">Total Tasks: 0</p>
<div id="taskList"></div>
</div>

<button class="back" onclick="location.href='index.html'">
⬅ Back to Dashboard
</button>

<script>
let tasks = JSON.parse(localStorage.getItem("baluTasks") || "[]");

function saveTasks(){
localStorage.setItem("baluTasks",JSON.stringify(tasks));
renderTasks();
}

function addTask(){
const text=document.getElementById("taskInput").value.trim();
const date=document.getElementById("taskDate").value;

if(!text){
alert("Please enter a task");
return;
}

tasks.push({
id:Date.now(),
text:text,
date:date,
done:false
});

document.getElementById("taskInput").value="";
saveTasks();
}

function completeTask(id){
const task=tasks.find(t=>t.id===id);
if(task)task.done=!task.done;
saveTasks();
}

function deleteTask(id){
if(confirm("Delete this task?")){
tasks=tasks.filter(t=>t.id!==id);
saveTasks();
}
}

function renderTasks(){
const list=document.getElementById("taskList");
list.innerHTML="";

document.getElementById("count").textContent=
"Total Tasks: "+tasks.length+
" | Pending: "+tasks.filter(t=>!t.done).length;

if(tasks.length===0){
list.innerHTML="<p>No tasks yet. Add your first task! 😊</p>";
return;
}

tasks.slice().reverse().forEach(task=>{
const div=document.createElement("div");
div.className="task";

const title=document.createElement("h3");
title.textContent=task.text;
if(task.done)title.className="done";

const date=document.createElement("small");
date.textContent=task.date ? "📅 "+task.date : "📅 No date";

const doneBtn=document.createElement("button");
doneBtn.className="complete";
doneBtn.textContent=task.done?"Undo":"✔ Complete";
doneBtn.onclick=()=>completeTask(task.id);

const deleteBtn=document.createElement("button");
deleteBtn.className="delete";
deleteBtn.textContent="🗑 Delete";
deleteBtn.onclick=()=>deleteTask(task.id);

div.append(title,date,document.createElement("br"),doneBtn,deleteBtn);
list.appendChild(div);
});
}

renderTasks();
</script>

</body>
</html>
