
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balu Daily Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  padding: 16px;
}

header {
  background: #1e293b;
  padding: 22px;
  border-radius: 18px;
  text-align: center;
  margin-bottom: 20px;
}

header h1 {
  font-size: 26px;
  margin: 0 0 10px;
}

header p {
  color: #cbd5e1;
  margin: 0;
}

.date-box {
  background: #1e293b;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 15px;
  text-align: center;
  color: #93c5fd;
  font-size: 18px;
  font-weight: bold;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.stat {
  background: #1e293b;
  padding: 16px 8px;
  border-radius: 14px;
  text-align: center;
}

.stat h2 {
  margin: 0;
  font-size: 24px;
}

.stat p {
  margin: 8px 0 0;
  color: #cbd5e1;
  font-size: 13px;
}

.card {
  background: #1e293b;
  padding: 18px;
  border-radius: 18px;
  margin-bottom: 16px;
}

.card h2 {
  margin-top: 0;
}

input, select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #475569;
  background: #101827;
  color: white;
  font-size: 16px;
  margin-bottom: 10px;
}

button {
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.add-btn {
  width: 100%;
  background: #2563eb;
  color: white;
  font-weight: bold;
}

.task {
  background: #101827;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 12px;
  border: 1px solid #334155;
}

.task-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.task-text {
  flex: 1;
  overflow-wrap: anywhere;
  font-size: 16px;
}

.task.completed .task-text {
  text-decoration: line-through;
  color: #94a3b8;
}

.task-meta {
  color: #94a3b8;
  font-size: 13px;
  margin-top: 8px;
}

.task-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.complete-btn {
  flex: 1;
  background: #15803d;
  color: white;
}

.delete-btn {
  background: #dc2626;
  color: white;
}

.empty {
  text-align: center;
  color: #94a3b8;
  padding: 25px;
}

.home-btn {
  display: block;
  text-align: center;
  text-decoration: none;
  background: #334155;
  color: white;
  padding: 15px;
  border-radius: 12px;
  margin-top: 20px;
}

.footer {
  text-align: center;
  color: #64748b;
  font-size: 12px;
  margin: 25px 0;
}
</style>
</head>

<body>

<header>
  <h1>🤖 Balu Daily Assistant</h1>
  <p>Your Personal Daily Task Manager</p>
</header>

<div class="date-box" id="todayDate"></div>

<div class="stats">
  <div class="stat">
    <h2 id="totalTasks">0</h2>
    <p>Total</p>
  </div>

  <div class="stat">
    <h2 id="pendingTasks">0</h2>
    <p>Pending</p>
  </div>

  <div class="stat">
    <h2 id="completedTasks">0</h2>
    <p>Completed</p>
  </div>
</div>

<div class="card">
  <h2>➕ Add New Task</h2>

  <input
    type="text"
    id="taskInput"
    placeholder="Enter your task..."
  >

  <select id="taskCategory">
    <option value="Personal">Personal</option>
    <option value="Office Work">Office Work</option>
    <option value="CMRL">CMRL</option>
    <option value="Maintenance">Maintenance</option>
    <option value="Other">Other</option>
  </select>

  <button class="add-btn" onclick="addTask()">
    ➕ Add Task
  </button>
</div>

<div class="card">
  <h2>📋 Today's Tasks</h2>
  <div id="taskList"></div>
</div>

<a href="index.html" class="home-btn">
  🏠 Back to Home
</a>

<div class="footer">
  Balu Mass Smart AI © 2026
</div>

<script>
const STORAGE_KEY = "balu_daily_tasks_2026";

let tasks = [];

try {
  tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
} catch (e) {
  tasks = [];
}

function saveTasks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}

function showDate() {
  const now = new Date();

  document.getElementById("todayDate").textContent =
    now.toLocaleDateString("en-IN", {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });
}

function addTask() {
  const input = document.getElementById("taskInput");
  const category = document.getElementById("taskCategory");

  const text = input.value.trim();

  if (!text) {
    input.focus();
    return;
  }

  tasks.unshift({
    id: Date.now(),
    text: text,
    category: category.value,
    completed: false,
    createdAt: new Date().toLocaleTimeString("en-IN", {
      hour: "2-digit",
      minute: "2-digit"
    })
  });

  saveTasks();
  input.value = "";
  renderTasks();
  input.focus();
}

function toggleTask(id) {
  tasks = tasks.map(task => {
    if (task.id === id) {
      task.completed = !task.completed;
    }
    return task;
  });

  saveTasks();
  renderTasks();
}

function deleteTask(id) {
  tasks = tasks.filter(task => task.id !== id);
  saveTasks();
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById("taskList");

  const total = tasks.length;
  const completed = tasks.filter(task => task.completed).length;
  const pending = total - completed;

  document.getElementById("totalTasks").textContent = total;
  document.getElementById("pendingTasks").textContent = pending;
  document.getElementById("completedTasks").textContent = completed;

  if (total === 0) {
    list.innerHTML = `
      <div class="empty">
        No tasks yet.<br><br>
        Add your first task above! 👆
      </div>
    `;
    return;
  }

  list.innerHTML = tasks.map(task => `
    <div class="task ${task.completed ? "completed" : ""}">
      <div class="task-top">
        <div class="task-text">
          ${escapeHTML(task.text)}
        </div>
      </div>

      <div class="task-meta">
        📁 ${escapeHTML(task.category)}
        &nbsp; • &nbsp;
        🕒 ${escapeHTML(task.createdAt)}
      </div>

      <div class="task-actions">
        <button
          class="complete-btn"
          onclick="toggleTask(${task.id})"
        >
          ${task.completed ? "↩ Undo" : "✓ Complete"}
        </button>

        <button
          class="delete-btn"
          onclick="deleteTask(${task.id})"
        >
          🗑 Delete
        </button>
      </div>
    </div>
  `).join("");
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

document.getElementById("taskInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    addTask();
  }
});

showDate();
renderTasks();
</script>

</body>
</html>
