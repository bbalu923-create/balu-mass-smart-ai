
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balu Daily Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}

.container {
  max-width: 800px;
  margin: auto;
}

.card {
  background: #1e293b;
  padding: 22px;
  border-radius: 20px;
  margin-bottom: 20px;
}

.header {
  text-align: center;
  padding: 28px 18px;
}

.header h1 {
  font-size: 27px;
  margin-bottom: 10px;
}

.header p {
  color: #cbd5e1;
}

.date-box {
  text-align: center;
  font-size: 21px;
  font-weight: bold;
  color: #93c5fd;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.stat {
  text-align: center;
  padding: 22px 8px;
}

.stat h2 {
  font-size: 32px;
  margin: 0 0 8px;
}

.stat p {
  color: #cbd5e1;
  margin: 0;
}

input, select {
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  border-radius: 13px;
  border: 1px solid #475569;
  background: #101827;
  color: white;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.add-btn {
  width: 100%;
  background: #2563eb;
  color: white;
  margin-top: 10px;
}

.task {
  background: #101827;
  border: 1px solid #334155;
  padding: 16px;
  border-radius: 15px;
  margin-bottom: 12px;
}

.task-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.task-check {
  width: 22px;
  height: 22px;
  margin-top: 3px;
  accent-color: #22c55e;
}

.task-content {
  flex: 1;
  min-width: 0;
}

.task-title {
  font-size: 17px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.completed .task-title {
  text-decoration: line-through;
  color: #94a3b8;
}

.task-meta {
  color: #94a3b8;
  font-size: 13px;
  margin-top: 9px;
  line-height: 1.7;
}

.category {
  display: inline-block;
  background: #263b60;
  color: #bfdbfe;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  margin-top: 8px;
}

.delete-btn {
  background: #dc2626;
  color: white;
  padding: 9px 12px;
  font-size: 13px;
}

.empty {
  text-align: center;
  color: #94a3b8;
  padding: 35px 10px;
}

.home-btn {
  width: 100%;
  background: #334155;
  color: white;
  margin-bottom: 20px;
}

.section-title {
  margin-top: 0;
}

.reminder-note {
  font-size: 13px;
  color: #94a3b8;
  line-height: 1.5;
}

@media (max-width: 480px) {
  body {
    padding: 12px;
  }

  .card {
    padding: 18px;
  }

  .header h1 {
    font-size: 24px;
  }

  .stats {
    gap: 8px;
  }

  .stat h2 {
    font-size: 26px;
  }
}
</style>
</head>

<body>
<div class="container">

  <div class="card header">
    <h1>🤖 Balu Daily Assistant</h1>
    <p>Your Personal Daily Task Manager</p>
  </div>

  <div class="card date-box" id="todayDate"></div>

  <div class="stats">
    <div class="card stat">
      <h2 id="totalCount">0</h2>
      <p>Total</p>
    </div>

    <div class="card stat">
      <h2 id="pendingCount">0</h2>
      <p>Pending</p>
    </div>

    <div class="card stat">
      <h2 id="completedCount">0</h2>
      <p>Completed</p>
    </div>
  </div>

  <div class="card">
    <h2>➕ Add New Task</h2>

    <input
      type="text"
      id="taskInput"
      placeholder="Enter your task..."
    >

    <select id="categoryInput">
      <option value="Personal">Personal</option>
      <option value="Office">Office</option>
      <option value="CMRL">CMRL</option>
      <option value="Other">Other</option>
    </select>

    <input type="date" id="taskDate">

    <label>Reminder (Optional)</label>
    <input type="datetime-local" id="reminderInput">

    <button class="add-btn" onclick="addTask()">
      ➕ Add Task
    </button>

    <p class="reminder-note">
      🔔 Reminder notification works while this page is open.
      Browser notification permission may be required.
    </p>
  </div>

  <div class="card">
    <h2 class="section-title">📋 Today's Tasks</h2>
    <div id="tasksList"></div>
  </div>

  <button class="home-btn" onclick="goHome()">
    🏠 Back to Home
  </button>

</div>

<script>
const STORAGE_KEY = "balu_daily_assistant_tasks_v2";

let tasks = [];

function loadTasks() {
  try {
    tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (error) {
    tasks = [];
  }

  renderTasks();
}

function saveTasks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  renderTasks();
}

function updateDate() {
  const now = new Date();

  document.getElementById("todayDate").textContent =
    now.toLocaleDateString("en-IN", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });

  document.getElementById("taskDate").value =
    now.toISOString().slice(0, 10);
}

function addTask() {
  const input = document.getElementById("taskInput");
  const category = document.getElementById("categoryInput").value;
  const date = document.getElementById("taskDate").value;
  const reminder = document.getElementById("reminderInput").value;

  const title = input.value.trim();

  if (!title) {
    alert("Please enter a task.");
    input.focus();
    return;
  }

  const task = {
    id: Date.now(),
    title: title,
    category: category,
    date: date,
    reminder: reminder,
    completed: false,
    notified: false
  };

  tasks.unshift(task);

  saveTasks();

  input.value = "";
  document.getElementById("reminderInput").value = "";

  if (reminder && "Notification" in window) {
    if (Notification.permission === "default") {
      Notification.requestPermission();
    }
  }
}

function toggleTask(id) {
  const task = tasks.find(t => t.id === id);

  if (task) {
    task.completed = !task.completed;
    saveTasks();
  }
}

function deleteTask(id) {
  if (!confirm("Delete this task?")) {
    return;
  }

  tasks = tasks.filter(t => t.id !== id);
  saveTasks();
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, function(character) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[character];
  });
}

function renderTasks() {
  const list = document.getElementById("tasksList");

  const total = tasks.length;
  const completed = tasks.filter(t => t.completed).length;
  const pending = total - completed;

  document.getElementById("totalCount").textContent = total;
  document.getElementById("pendingCount").textContent = pending;
  document.getElementById("completedCount").textContent = completed;

  if (tasks.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <h3>No tasks yet.</h3>
        <p>Add your first task above 👆</p>
      </div>
    `;
    return;
  }

  list.innerHTML = tasks.map(task => `
    <div class="task ${task.completed ? "completed" : ""}">
      <div class="task-top">

        <input
          class="task-check"
          type="checkbox"
          ${task.completed ? "checked" : ""}
          onchange="toggleTask(${task.id})"
        >

        <div class="task-content">
          <div class="task-title">
            ${escapeHTML(task.title)}
          </div>

          <span class="category">
            ${escapeHTML(task.category)}
          </span>

          <div class="task-meta">
            📅 ${task.date || "No date"}
            ${task.reminder ? "<br>🔔 " + escapeHTML(new Date(task.reminder).toLocaleString()) : ""}
            <br>
            Status: ${task.completed ? "Completed ✅" : "Pending ⏳"}
          </div>
        </div>

        <button class="delete-btn" onclick="deleteTask(${task.id})">
          🗑️
        </button>

      </div>
    </div>
  `).join("");
}

function checkReminders() {
  if (!("Notification" in window)) return;
  if (Notification.permission !== "granted") return;

  const now = new Date();

  tasks.forEach(task => {
    if (!task.reminder || task.completed || task.notified) return;

    const reminderTime = new Date(task.reminder);

    if (reminderTime <= now) {
      new Notification("🤖 Balu Daily Assistant", {
        body: "Reminder: " + task.title
      });

      task.notified = true;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }
  });
}

function goHome() {
  window.location.href = "index.html";
}

updateDate();
loadTasks();

// Check reminders every 30 seconds while page is open
setInterval(checkReminders, 30000);
</script>

</body>
</html>
